# Nginx reverse proxy for Sikok.
# Drop this in /etc/nginx/sites-available/sikok and symlink to sites-enabled.
# Adjust server_name and TLS paths for your VM.

upstream sikok_app {
    # uvicorn app.main:app --host 127.0.0.1 --port 8000
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name sikok.example.com;

    # ---- Static frontend (mobile web) ----
    root /var/www/sikok;
    index index.html;

    # ---- Long-lived Socket.IO upgrade ----
    location /socket.io/ {
        proxy_pass http://sikok_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ---- REST API ----
    location /api/ {
        proxy_pass http://sikok_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- Frontend SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip text assets
    gzip on;
    gzip_types text/css application/javascript text/html application/json;
    gzip_min_length 1024;

    client_max_body_size 2m;
}
